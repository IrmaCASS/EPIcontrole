name: app
description: "Aplicativo de auto-cuidado para pessoas com epilepsia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.4
  path: ^1.9.1
  crypto: ^3.0.7
  intl: ^0.20.3
  table_calendar: ^3.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg
    - assets/images/logo.png
    - assets/images/logo_transparente.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.jpeg"

flutter_native_splash:
  color: "#4A148C"
  image: assets/images/logo_transparente.png
  android: true
  ios: true
  android_12:
    color: "#4A148C"
    image: assets/images/logo_transparente.png
    